[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "closurelab"
description = "A priori evaluation of turbulence closures from stereo PIV, LDV, and CFD data"
authors = [{ name = "Aldo Gargiulo", email = "bzc6rs@virginia.edu" }]
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "h5py>=3.13",
    "xarray>=2024.11",
]

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff", "mypy", "scipy-stubs"]
docs = ["sphinx", "furo"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "NPY"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["h5py.*"]
ignore_missing_imports = true
