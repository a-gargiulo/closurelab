[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "closurelab"
description = "A priori evaluation of turbulence closures from stereo PIV, LDV, and CFD data"
authors = [{ name = "Aldo Gargiulo", email = "bzc6rs@virginia.edu" }]
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "h5py>=3.13",
    "xarray>=2024.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
